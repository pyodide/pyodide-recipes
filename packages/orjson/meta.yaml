package:
  name: orjson
  version: 3.13.0
  tag:
    - rust
  top-level:
    - orjson
source:
  url: https://files.pythonhosted.org/packages/source/o/orjson/orjson-3.13.0.tar.gz
  sha256: d1de5eb04485110c5da4c657e49168995d55e076b1ce60f1a042e254f4186c4f
build:
  script: |
    # whenever rustc >= 1.95, orjson uses a nightly-only feature so we have to
    # set RUSTC_BOOTSTRAP.
    export RUSTC_BOOTSTRAP=1
requirements:
  executable:
    - rustup
about:
  home: https://github.com/ijl/orjson
  PyPI: https://pypi.org/project/orjson
  summary: Fast, correct Python JSON library supporting dataclasses, datetimes,
    and numpy
  license: Apache-2.0 OR MIT
extra:
  recipe-maintainers:
    - spicy-sauce
