package:
  name: shapely
  version: 2.2.0
  top-level:
    - shapely
source:
  url: https://files.pythonhosted.org/packages/source/s/shapely/shapely-2.2.0.tar.gz
  sha256: e8865e553d874a1ec4a032057ea81fca9def37b188cd8fb550af3b3480b3f88c
build:
  vendor-sharedlib: true
  script: |
    export GEOS_CONFIG=${WASM_LIBRARY_DIR}/bin/geos-config
  cxxflags: |
    -fwasm-exceptions
  ldflags: |
    -fwasm-exceptions
requirements:
  run:
    - numpy
  host:
    - libgeos
    - numpy
test:
  imports:
    - shapely
    - shapely.geos
    - shapely.geometry
    - shapely.ops
    - shapely.prepared
    - shapely.validation
    - shapely.strtree
about:
  home: https://github.com/shapely/shapely
  PyPI: https://pypi.org/project/shapely
  summary: Geometric objects, predicates, and operations
  license: BSD-3-Clause
