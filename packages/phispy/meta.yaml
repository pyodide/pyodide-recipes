package:
  name: phispy
  version: 5.0.10
  top-level:
    - PhiSpyModules
    - PhiSpyRepeatFinder

source:
  url: https://files.pythonhosted.org/packages/source/p/phispy/phispy-5.0.10.tar.gz
  sha256: 8329fa472b84e150b3ef59b9388830f238dc69b290af2a1ea95567dde29ec6f8

build:
  cxxflags: -fwasm-exceptions
  ldflags: -fwasm-exceptions

requirements:
  run:
    - biopython
    - numpy
    - scikit-learn

test:
  imports:
    - PhiSpyModules
    - PhiSpyRepeatFinder

about:
  home: https://github.com/linsalrob/PhiSpy
  PyPI: https://pypi.org/project/PhiSpy
  summary: Prophage finder using multiple metrics
  license: MIT

extra:
  recipe-maintainers:
    - linsalrob
