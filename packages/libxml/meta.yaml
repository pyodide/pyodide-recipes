package:
  name: libxml
  version: 2.15.4
  tag:
    - library
    - static_library
source:
  sha256: 98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821
  url: https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz

requirements:
  host:
    - libzlib
    - libiconv

build:
  type: static_library
  script: |
    emconfigure ./configure \
        CFLAGS="-fPIC" \
        --disable-dependency-tracking \
        --disable-shared \
        --without-python \
        --with-iconv="${WASM_LIBRARY_DIR}" \
        --with-zlib="${WASM_LIBRARY_DIR}" \
        --prefix=${WASM_LIBRARY_DIR}
    emmake make -j ${PYODIDE_JOBS:-3}
    emmake make install
about:
  home: https://gitlab.gnome.org/GNOME/libxml2
  license: MIT
