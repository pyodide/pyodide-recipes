package:
  name: lightgbm
  version: 4.7.0
source:
  url: https://files.pythonhosted.org/packages/source/l/lightgbm/lightgbm-4.7.0.tar.gz
  sha256: f8e20f682c9aabd000bcf4a7ed8aa6f473c1adfecccae34ec24e823d156f4af0
build:
  backend-flags: |
    skbuild.cmake.define.USE_OPENMP=OFF
    # for debugging
    # skbuild.build.verbose=true
  exports: requested
  script: |
    export CMAKE_GENERATOR="Unix Makefiles"
requirements:
  run:
    - numpy
    - scipy
    - scikit-learn
    - narwhals
test:
  imports:
    - lightgbm
about:
  home: https://github.com/microsoft/LightGBM
  PyPI: https://pypi.org/project/lightgbm
  summary: LightGBM Python Package
  license: MIT
extra:
  recipe-maintainers:
    - jameslamb
