package:
  name: Cartopy
  version: 0.26.0
  top-level:
    - cartopy
source:
  url: https://files.pythonhosted.org/packages/source/c/cartopy/cartopy-0.26.0.tar.gz
  sha256: b87a35835f30333760cc46194bd90b6a4958d12f488f50131d4c4c0962ad9c3c
test:
  imports:
    - cartopy
    - cartopy.trace
    - cartopy.mpl.geoaxes
    - cartopy.crs
requirements:
  host:
    - libgeos
    - numpy
  run:
    - shapely
    - pyshp
    - pyproj
    - matplotlib
    - scipy

build:
  vendor-sharedlib: true
  script: |
    # Put geos-config on the path
    export PATH=$PATH:${WASM_LIBRARY_DIR}/bin/

about:
  home: http://scitools.org.uk/cartopy
  PyPI: https://pypi.org/project/Cartopy/
  summary: A library providing cartographic tools for python
  license: LGPL-3.0+
