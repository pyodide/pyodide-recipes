package:
  name: pillow-heif
  version: 1.8.1
  top-level:
    - pillow_heif
source:
  url: https://files.pythonhosted.org/packages/source/p/pillow_heif/pillow_heif-1.8.1.tar.gz
  sha256: 521ebffb8a181d56c3904e5a61f20903edee0d9d3275967b8fb345f866215c06
requirements:
  run:
    - cffi
    - Pillow
  host:
    - cffi
    - libheif
build:
  vendor-sharedlib: true
  script: |
    export LIBHEIF_ROOT=${WASM_LIBRARY_DIR}
test:
  imports:
    - pillow_heif
about:
  home: https://github.com/bigcat88/pillow_heif
  PyPI: https://pypi.org/project/pillow_heif
  summary: Python 3.6+ interface to libheif library
  license: LGPL-2.1
# Note: this package needs to be manually upgraded to the next version
