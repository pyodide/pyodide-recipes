package:
  name: pandas
  version: 3.1.1
  tag:
    - min-scipy-stack
  top-level:
    - pandas
source:
  url: https://files.pythonhosted.org/packages/source/p/pandas/pandas-3.1.1.tar.gz
  sha256: 05fed3e3b7c99b226f160e29d7d6cb7ef39638c758cbfe42b3f24ba34f04b859
  patches:
    - patches/0001-Fall-back-to-zoneinfo.ZoneInfo.patch
build:
  cflags: -Werror=implicit-function-declaration
    -Werror=mismatched-parameter-types -Werror=mismatched-return-types -Oz
  ldflags: --Wl,--fatal-warnings -Oz
requirements:
  host:
    - numpy
  run:
    - numpy
    - python-dateutil
    - pytz
about:
  home: https://pandas.pydata.org
  PyPI: https://pypi.org/project/pandas
  summary: Powerful data structures for data analysis, time series, and
    statistics
  license: BSD-3-Clause
