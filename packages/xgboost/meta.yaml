package:
  name: xgboost
  version: 3.4.1
  top-level:
    - xgboost
source:
  url: https://files.pythonhosted.org/packages/source/x/xgboost/xgboost-3.4.1.tar.gz
  sha256: 6968a4c71efdfa859df0dfcad0d99211c95c28c4ffd6aecff46efff77d18026a
build:
  # DMLC_LOG_STACK_TRACE=0 is to handle https://github.com/dmlc/xgboost/issues/8595
  cflags: |
    -DDMLC_USE_FOPEN64=0
    -DDMLC_ENABLE_STD_THREAD=0
    -DDMLC_LOG_STACK_TRACE=0
    -DUSE_OPENMP=0
  exports: requested
requirements:
  run:
    - numpy
    - scipy
    - setuptools
about:
  home: https://github.com/dmlc/xgboost
  PyPI: https://pypi.org/project/xgboost
  summary: XGBoost Python Package
  license: Apache-2.0
