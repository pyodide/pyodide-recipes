package:
  name: libffmpeg
  version: "4.4.1"
  tag:
    - library
    - static_library
source:
  url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n4.4.1.tar.gz
  sha256: 82b43cc67296bcd01a59ae6b327cdb50121d3a9e35f41a30de1edd71bb4a6666
  extract_dir: FFmpeg-n4.4.1
build:
  type: static_library
  script: |
    # --target-os defaults to the build machine; pin it to what Linux CI
    # infers so that macOS hosts do not get Darwin linker flags.
    emconfigure ./configure \
      --extra-cflags="-fPIC" \
      --disable-asm \
      --disable-x86asm \
      --disable-inline-asm \
      --disable-doc \
      --disable-stripping \
      --disable-programs \
      --disable-pthreads \
      --nm="emnm -g" \
      --ar=emar --cc=emcc --cxx=em++ --objcc=emcc --dep-cc=emcc --ranlib=emranlib \
      --enable-cross-compile \
      --target-os=linux \
      --prefix=${WASM_LIBRARY_DIR}

    emmake make -j${PYODIDE_JOBS:-3}
    emmake make install
about:
  home: https://ffmpeg.org/
  license: LGPL-2.1+
