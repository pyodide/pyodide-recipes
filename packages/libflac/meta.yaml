package:
  name: libflac
  version: 1.5.0
  tag:
    - library
    - static_library
source:
  url: https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0.tar.xz
  sha256: f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920

build:
  type: static_library
  script: |
    # Use official emscripten libogg port
    embuilder build ogg --pic
    export CPPFLAGS="--use-port=ogg"
    export LDFLAGS="--use-port=ogg"
    emconfigure ./configure --with-pic --disable-shared --prefix=${WASM_LIBRARY_DIR}
    emmake make -j ${PYODIDE_JOBS:-3}
    emmake make install
about:
  home: https://xiph.org/flac/
  license: BSD-3-Clause
extra:
  recipe-maintainers:
    - swnf
