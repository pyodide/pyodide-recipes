package:
  name: libyaml
  version: 0.2.5
  tag:
    - library
    - static_library
    - cmake
source:
  url: https://github.com/yaml/libyaml/archive/0.2.5.zip
  sha256: 14605baa6dfc0c4d3ab943a46a627413c0388736e453b67fe4e90c9683c8cbc8

build:
  type: static_library
  script: |
    export INSTALL_DIR=${WASM_LIBRARY_DIR}

    CFLAGS="-fPIC" emcmake cmake \
      -DCMAKE_INSTALL_PREFIX=${INSTALL_DIR} \
      -DBUILD_TESTING=OFF \
      .
    emmake make -j ${PYODIDE_JOBS:-3}
    emmake make install
    rm -f ${INSTALL_DIR}/lib/libyaml.a
    ln -s ${INSTALL_DIR}/lib/libyaml_static.a ${INSTALL_DIR}/lib/libyaml.a
about:
  home: https://pyyaml.org/wiki/LibYAML
  license: MIT
