package:
  name: libde265
  version: 1.1.3
  tag:
    - library
    - static_library
source:
  url: https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz
  sha256: 554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905

build:
  type: static_library
  script: |
    # libde265 >= 1.0.16 only ships a CMake build
    emcmake cmake -S . -B build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=${WASM_LIBRARY_DIR} \
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
        -DBUILD_SHARED_LIBS=OFF \
        -DENABLE_SIMD=OFF \
        -DENABLE_SDL=OFF \
        -DENABLE_DECODER=OFF \
        -DENABLE_ENCODER=OFF \
        -DENABLE_SHERLOCK265=OFF

    cmake --build build -j ${PYODIDE_JOBS:-3}
    cmake --install build
about:
  home: https://github.com/strukturag/libde265
  license: LGPL-3.0
