package:
  name: sisl
  version: 0.20.0
  top-level:
    - sisl_toolbox
    - sisl
source:
  url: https://files.pythonhosted.org/packages/source/s/sisl/sisl-0.20.0.tar.gz
  sha256: b590b24030947a040ab6144e10dcf36b4d6c1fac2868fe880002a1869716e05e
about:
  home: https://github.com/zerothi/sisl
  PyPI: https://pypi.org/project/sisl
  summary: Manipulation and post-processing of DFT output and creating
    tight-binding models for NEGF transport
  license: MPL-2.0

requirements:
  host:
    - numpy
    - pyparsing
  run:
    - pyparsing
    - numpy
    - scipy
    - tqdm
    - xarray
    - pandas
    - matplotlib

build:
  script: |
    export CMAKE_ARGS="-DWITH_FORTRAN=OFF"

extra:
  recipe-maintainers:
    - zerothi
