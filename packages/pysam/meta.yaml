package:
  name: pysam
  version: 0.24.1
  top-level:
    - pysam
source:
  url: https://files.pythonhosted.org/packages/source/p/pysam/pysam-0.24.1.tar.gz
  sha256: 90f612afccdb454d2447ecb5229266c6e7f991093deed4ed0a791db01f7fc994
  patches:
    - patches/0001-remove_config_library.patch
    - patches/0001-use-emmake.patch
    - patches/0001-remove-darwin-check.patch
requirements:
  host:
    - libzlib
  constraint:
    - cython < 3.1.0
build:
  vendor-sharedlib: false # done by the package itself
  # pysam_seq_comp_table is a data symbol shared between extension modules
  exports: whole_archive
  cflags: |
    -I$(WASM_LIBRARY_DIR)/include
    -fPIC
  script: |
    embuilder build zlib --pic
    embuilder build bzip2 --pic
    cd htslib
    emconfigure ./configure CFLAGS="-s USE_ZLIB=1 -s USE_BZIP2=1 -fPIC" --disable-lzma
    export HTSLIB_MODE="separate"
about:
  home: https://github.com/pysam-developers/pysam
  PyPI: https://pypi.org/project/pysam
  summary: Package for reading, manipulating, and writing genomic data
  license: MIT
extra:
  recipe-maintainers:
    - stevenweaver
