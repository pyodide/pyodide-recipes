package:
  name: nlopt
  version: 2.11.0
  top-level:
    - nlopt

source:
  url: https://github.com/stevengj/nlopt/archive/v2.11.0.tar.gz
  sha256: 53e552d83e9294d67db37f0f4a23f15933a9ef698485301a18b98b40004cf0de

  extras:
    - - extras/setup.py
      - ./setup.py
    - - extras/pyproject.toml
      - ./pyproject.toml

requirements:
