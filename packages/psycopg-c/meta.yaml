package:
  name: psycopg-c
  version: 3.3.9
  top-level:
    - psycopg_c

source:
  url: https://files.pythonhosted.org/packages/source/p/psycopg_c/psycopg_c-3.3.9.tar.gz
  sha256: 591fcbcb40e089235a7f096b9e887e71ccae78fd337aba198d918e33707c5e01
  patches:
    - patches/0001-Use-Emscripten-endian-functions.patch

requirements:
  host:
    - libpq

build:
  script: |
    export PATH="${WASM_LIBRARY_DIR}/bin:${PATH}"

about:
  home: https://psycopg.org/
  PyPI: https://pypi.org/project/psycopg-c
  summary: PostgreSQL database adapter for Python C optimisation distribution
  license: LGPL-3.0-only
extra:
  recipe-maintainers:
    - ryanking13
