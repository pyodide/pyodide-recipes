package:
  name: healpy
  version: 1.20.1
  top-level:
    - healpy
source:
  url: https://files.pythonhosted.org/packages/source/h/healpy/healpy-1.20.1.tar.gz
  sha256: 000203dafd09f6cb864147b8308661b405a0f8a9dba10bc0842b7ddfb40717fe
  patches:
    - patches/0001-Skip-linking-cfitsio-and-healpix_cxx-programs-for-Py.patch
    - patches/0002-without-zlib-check-fortran.patch
    - patches/0003-install-path.patch
    - patches/0004-disable-openmp.patch
requirements:
  host:
    - libzlib
    - numpy
  run:
    - numpy
    - astropy
build:
  vendor-sharedlib: true
  exports: requested
  cflags: |
    -I$(WASM_LIBRARY_DIR)/include
    -fwasm-exceptions
  cxxflags: |
    -fwasm-exceptions
  ldflags: |
    -fwasm-exceptions
  script: |
    export CXXFLAGS="$CXXFLAGS -sSIDE_MODULE=1"
about:
  home: https://github.com/healpy/healpy
  PyPI: https://pypi.org/project/healpy
  summary: Healpix tools package for Python
  license: GPL-2.0-only
extra:
  recipe-maintainers:
    - juntyr
