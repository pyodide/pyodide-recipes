package:
  name: yt
  version: 4.4.4
  top-level:
    - yt
source:
  url: https://files.pythonhosted.org/packages/source/y/yt/yt-4.4.4.tar.gz
  sha256: 4be5142ca9a7654d9ba63529a1456a6389e7e66685aa4013758ed8b254308452
  patches:
    - patches/skip-openmp.patch
requirements:
  host:
    - numpy
  run:
    - ewah_bool_utils
    - numpy
    - matplotlib
    - sympy
    - setuptools
    - packaging
    - unyt
    - cmyt
    - colorspacious
    - tqdm
    - tomli
    - tomli-w
build:
  # The test module is imported from the top level `__init__.py`
  # so it cannot be unvendored
  unvendor-tests: false
about:
  home: https://github.com/yt-project/yt
  PyPI: https://pypi.org/project/yt
  summary: An analysis and visualization toolkit for volumetric data
  license: BSD-3-Clause
