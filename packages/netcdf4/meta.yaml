package:
  name: netcdf4
  version: 1.7.5.1.post1
  top-level:
    - netCDF4
source:
  url: https://files.pythonhosted.org/packages/source/n/netcdf4/netcdf4-1.7.5.1.post1.tar.gz
  sha256: 9823076013fd54e7984d3ae8f431671fd199b15eeb267f91b8c4b057fd8324ab
requirements:
  host:
    - libhdf5
    - libnetcdf
  run:
    - numpy
    - packaging
    - cftime
    - certifi
test:
  imports:
    - netCDF4
build:
  vendor-sharedlib: true
  script: |
    export PATH=${WASM_LIBRARY_DIR}/bin:${PATH}
    export HDF5_DIR=${WASM_LIBRARY_DIR}
    echo ${HDF5_DIR}
  ldflags: |
    -L$(WASM_LIBRARY_DIR)/lib
    -lhdf5
    -lhdf5_hl
about:
  home: https://github.com/Unidata/netcdf4-python
  PyPI: https://pypi.org/project/netcdf4
  summary: Provides an object-oriented python interface to the netCDF version 4
    library
  license: MIT
