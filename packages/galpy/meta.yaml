package:
  name: galpy
  version: 1.12.1
  top-level:
    - galpy
source:
  url: https://files.pythonhosted.org/packages/source/g/galpy/galpy-1.12.1.tar.gz
  sha256: d6f58cffca07c6693a6dcde660833d1b7089edc60082edfcb7b7d7d8ba8d3357
build:
  script: export LIBGSL_INCLUDE_PATH=$(pkg-config --cflags-only-I
    --dont-define-prefix gsl) export LIBGSL_LIBRARY_PATH=$(pkg-config
    --libs-only-L --dont-define-prefix gsl)
  cflags: |
    $(LIBGSL_INCLUDE_PATH)
  ldflags: |
    $(LIBGSL_LIBRARY_PATH)
  exports: requested
requirements:
  run:
    - numpy
    - scipy
    - matplotlib
    - astropy
    - future
    - setuptools
  host:
    - libgsl
    - numpy
    - scipy
test:
  imports:
    - galpy
    - galpy.potential
    - galpy.orbit
    - galpy.actionAngle
    - galpy.df
about:
  home: http://github.com/jobovy/galpy
  PyPI: https://pypi.org/project/galpy
  summary: Galactic Dynamics in python
  license: BSD-3-Clause
extra:
  recipe-maintainers:
    - jobovy
